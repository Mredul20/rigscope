name: Release

# Publish a release on GitHub (Releases > Draft a new release, with a tag like
# v1.2.0) and this builds Rigscope.exe and attaches it with its checksum.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no third-party dependencies, so nothing to cache
      - run: go test ./...
      - name: Build Rigscope.exe
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o dist/Rigscope.exe .
          cd dist && sha256sum Rigscope.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rigscope.exe
            dist/SHA256SUMS.txt
          tag_name: ${{ github.event.release.tag_name }}
